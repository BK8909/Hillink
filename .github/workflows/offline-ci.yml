name: offline-ci
# Offline verification only. No API key is provided and external model calls are blocked:
# HILLINK_LLM_ENABLED=0, HILLINK_LLM_EXTERNAL_OPT_IN=0 and the offline network guard (tools/offline_test_guard).
# LIVE judgments are never run here; LIVE results in the reports come from approved local runs.
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: hillink
    env:
      HILLINK_LLM_ENABLED: '0'
      HILLINK_LLM_EXTERNAL_OPT_IN: '0'
      HILLINK_AGENT_MODE: replay
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Package manifest and secret scan
        run: |
          python tools/verify_package.py
          python tools/scan_secrets.py
      - name: Restore data package into a fresh cache (SHA checked)
        run: |
          export HILLINK_DATA_HOME="$RUNNER_TEMP/hillink-data"
          echo "HILLINK_DATA_HOME=$HILLINK_DATA_HOME" >> "$GITHUB_ENV"
          python -B tools/bootstrap_data.py --json
      - name: Start-up check (no server, no external call)
        run: HILLINK_PYTHON="$(command -v python)" bash tools/start_product.sh --check
      - name: Node tests
        run: cd timeline/viewer && node --test tests/*.cjs
      - name: Python tests (fails only on failures not in tools/ci/known_failures.txt)
        run: |
          PYTHONPATH="$PWD/tools/offline_test_guard" python -m pytest -q -rA -p no:cacheprovider timeline/viewer/tests > "$RUNNER_TEMP/pytest.log" 2>&1 || true
          tail -3 "$RUNNER_TEMP/pytest.log"
          python tools/ci/check_failures.py "$RUNNER_TEMP/pytest.log" tools/ci/known_failures.txt
      - name: V16 stored replay 38/38
        run: python tools/ci/check_replay.py
